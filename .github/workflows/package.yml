name: package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and verify package
        shell: bash
        run: python packaging/publish.py --rid ${{ matrix.rid }}
      - name: Upload unsigned package evidence
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-${{ matrix.rid }}
          path: artifacts/*/${{ matrix.rid }}/
          if-no-files-found: error
