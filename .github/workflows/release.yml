name: Rip build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet test -c Release --no-restore

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Allocate monotonically increasing version
        id: version
        shell: pwsh
        run: |
          $version = "1.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build installer and update feed
        shell: pwsh
        env:
          RIP_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/windows.ps1 -Version $env:RIP_VERSION
      - name: Packaging verification tests
        shell: pwsh
        run: ./tests/packaging.test.ps1
      - name: Windows presentation tests
        shell: pwsh
        run: |
          dotnet test --project tests/Rip.App.Tests/Rip.App.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test --project tests/Rip.Core.Tests/Rip.Core.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Keep installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rip-windows-${{ steps.version.outputs.value }}
          path: artifacts/windows/${{ steps.version.outputs.value }}/releases/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: windows
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Rip-windows-${{ needs.windows.outputs.version }}
          path: release-files
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RIP_VERSION: ${{ needs.windows.outputs.version }}
          RIP_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem release-files -File | ForEach-Object FullName
          $existing = gh release list --repo $env:RIP_REPO --limit 100 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $newer = @($existing | ConvertFrom-Json | Where-Object {
            !$_.isDraft -and !$_.isPrerelease -and $_.tagName -match '^v\d+\.\d+\.\d+$' -and
            [version]$_.tagName.Substring(1) -gt [version]$env:RIP_VERSION
          })
          $latest = if ($newer.Count) { 'false' } else { 'true' }
          gh release create "v$env:RIP_VERSION" @files --repo $env:RIP_REPO --target $env:GITHUB_SHA --title "Rip $env:RIP_VERSION" --generate-notes "--latest=$latest"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
