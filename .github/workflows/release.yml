name: Rip build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet test -c Release --no-restore

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Allocate monotonically increasing version
        id: version
        shell: pwsh
        run: |
          $version = "1.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build installer and update feed
        shell: pwsh
        env:
          RIP_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/windows.ps1 -Version $env:RIP_VERSION
      - name: Windows presentation tests
        shell: pwsh
        run: |
          dotnet test --project tests/Rip.App.Tests/Rip.App.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test --project tests/Rip.Core.Tests/Rip.Core.Tests.csproj -c Release
      - name: Keep installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rip-windows-${{ steps.version.outputs.value }}
          path: artifacts/windows/releases/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RIP_VERSION: ${{ steps.version.outputs.value }}
          RIP_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem artifacts/windows/releases -File | ForEach-Object FullName
          gh release create "v$env:RIP_VERSION" @files --repo $env:RIP_REPO --target $env:GITHUB_SHA --title "Rip $env:RIP_VERSION" --generate-notes --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
