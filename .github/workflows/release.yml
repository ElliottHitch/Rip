name: Rip build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the next 0.1.x GitHub release after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet test -c Release --no-restore

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Select build version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RIP_REPO: ${{ github.repository }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $version = '0.1.0'

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and "$env:PUBLISH_RELEASE".ToLowerInvariant() -eq 'true') {
            $existing = gh release list --repo $env:RIP_REPO --limit 100 --json tagName,isDraft,isPrerelease
            if ($LASTEXITCODE) { exit $LASTEXITCODE }

            $patches = @($existing | ConvertFrom-Json | Where-Object {
              !$_.isDraft -and !$_.isPrerelease -and $_.tagName -match '^v0\.1\.(\d+)$'
            } | ForEach-Object {
              [int]([regex]::Match($_.tagName, '^v0\.1\.(\d+)$').Groups[1].Value)
            })

            $nextPatch = if ($patches.Count) {
              [int](($patches | Measure-Object -Maximum).Maximum) + 1
            } else {
              0
            }
            $version = "0.1.$nextPatch"
          }

          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build installer and update feed
        shell: pwsh
        env:
          RIP_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/windows.ps1 -Version $env:RIP_VERSION
      - name: Packaging verification tests
        shell: pwsh
        run: ./tests/packaging.test.ps1
      - name: Windows presentation tests
        shell: pwsh
        run: |
          dotnet test --project tests/Rip.App.Tests/Rip.App.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test --project tests/Rip.Core.Tests/Rip.Core.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Keep installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rip-windows-${{ steps.version.outputs.value }}
          path: artifacts/windows/${{ steps.version.outputs.value }}/releases/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment:
      name: public-release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Rip-windows-${{ needs.windows.outputs.version }}
          path: release-files
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RIP_VERSION: ${{ needs.windows.outputs.version }}
          RIP_REPO: ${{ github.repository }}
        run: |
          $publishRoot = Join-Path $PWD 'public-release-files'
          New-Item -ItemType Directory -Path $publishRoot -Force | Out-Null

          $publishNames = @(
            'Rip-win-Setup.exe',
            'Rip-win-Portable.zip',
            "Rip-$env:RIP_VERSION-full.nupkg",
            'releases.win.json'
          )

          foreach ($name in $publishNames) {
            Copy-Item -LiteralPath (Join-Path 'release-files' $name) -Destination (Join-Path $publishRoot $name)
          }

          $checksums = foreach ($name in $publishNames) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $publishRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $publishRoot 'SHA256SUMS') -Encoding ascii

          $files = Get-ChildItem $publishRoot -File | ForEach-Object FullName
          gh release create "v$env:RIP_VERSION" @files --repo $env:RIP_REPO --target $env:GITHUB_SHA --title "Rip $env:RIP_VERSION" --generate-notes --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
