<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Separate streams. One file.</title>
  <desc id="description">Rip downloads video at your chosen quality and the best available audio separately, then combines them into one file. Standard mode keeps the original codecs in MKV. Optional UniFi mode converts to MP4 with H.264 video and AAC audio.</desc>
  <rect width="800" height="300" rx="12" fill="#F8F9F9"/>
  <g stroke="#253337" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="49" y="61" width="28" height="22" rx="3"/>
    <path d="m60 67 8 5-8 5Z"/>
    <path d="M53 157v-6a10 10 0 0 1 20 0v6M53 157v8h5v-11h-2a3 3 0 0 0-3 3Zm20 0v8h-5v-11h2a3 3 0 0 1 3 3Z"/>
  </g>
  <g stroke="#9BA7AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M281 79h24c32 0 31 43 63 43M281 165h24c32 0 31-43 63-43M368 122h171"/>
    <path d="m533 117 6 5-6 5"/>
  </g>
  <circle cx="368" cy="122" r="4" fill="#D94B29"/>
  <g stroke="#253337" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M568 103h19l10 10v29h-29ZM587 103v10h10"/>
    <path d="m577 121 10 6-10 6Z" fill="#D94B29" stroke="#D94B29"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g fill="#253337" font-size="21" font-weight="600">
      <text x="96" y="78">Video</text>
      <text x="96" y="164">Audio</text>
      <text x="619" y="129">One file</text>
    </g>
    <g fill="#56656A" font-size="15">
      <text x="96" y="101">Your chosen quality</text>
      <text x="96" y="187">Best available</text>
      <text x="448" y="107" text-anchor="middle">Combine</text>
    </g>
    <path d="M48 217h704" stroke="#DDE2E3"/>
    <g fill="#253337" font-size="16" font-weight="600">
      <text x="48" y="247">Standard · MKV</text>
      <text x="440" y="247">UniFi mode · MP4</text>
    </g>
    <g fill="#56656A" font-size="15">
      <text x="48" y="270">Keep original codecs</text>
      <text x="440" y="270">Convert to H.264 + AAC</text>
