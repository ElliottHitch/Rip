<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Resilient YouTube downloader pipeline</title>
  <desc id="desc">A six-stage pipeline: input URL, metadata and format resolution, bounded retry and fresh re-resolution, separate video and audio stream downloads, remux or transcode, and non-overwriting final MP4 publication. The publisher uses a private temporary copy, a same-directory final rename, and final verification. Existing destinations are rejected. An HTTP 403 branch gets one best-effort refresh; after retry exhaustion the app shows an error and does not bypass service restrictions.</desc>

  <rect width="1200" height="560" rx="24" fill="#08121f"/>
  <rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#1f3a52"/>

  <text x="52" y="50" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">DOWNLOAD PIPELINE / UNIFI-READY MP4</text>
  <text x="52" y="91" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700">From URL to a verified final file</text>
  <text x="52" y="119" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">Resolve once, recover within a bound, then publish only after FFmpeg and output checks complete.</text>

  <!-- Main pipeline connector -->
  <path d="M 201 238 H 217 M 391 238 H 407 M 581 238 H 597 M 771 238 H 787 M 961 238 H 977" fill="none" stroke="#5eead4" stroke-width="3"/>
  <path d="m 211 232 9 6-9 6 M 401 232 410 238l-9 6 M 591 232 600 238l-9 6 M 781 232 790 238l-9 6 M 971 232 980 238l-9 6" fill="#5eead4"/>

  <!-- Stage 1 -->
  <g>
    <rect x="35" y="164" width="166" height="148" rx="16" fill="#10273b" stroke="#2c5870" stroke-width="2"/>
    <circle cx="61" cy="192" r="17" fill="#163b52" stroke="#5eead4" stroke-width="2"/>
    <text x="61" y="198" text-anchor="middle" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">01</text>
    <text x="91" y="198" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">Input URL</text>
    <rect x="53" y="222" width="130" height="30" rx="7" fill="#091a2a" stroke="#31556b"/>
    <text x="65" y="242" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">https://…/video</text>
    <text x="53" y="277" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Single-video URL</text>
    <text x="53" y="295" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Playlist input rejected</text>
  </g>

  <!-- Stage 2 -->
  <g>
    <rect x="225" y="164" width="166" height="148" rx="16" fill="#10273b" stroke="#2c5870" stroke-width="2"/>
    <circle cx="251" cy="192" r="17" fill="#163b52" stroke="#5eead4" stroke-width="2"/>
    <text x="251" y="198" text-anchor="middle" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">02</text>
    <text x="281" y="198" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">Resolve</text>
    <text x="281" y="219" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">metadata + formats</text>
    <text x="243" y="257" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">yt-dlp selects best</text>
    <text x="243" y="275" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">video and audio</text>
    <text x="243" y="293" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">streams</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <rect x="415" y="164" width="166" height="148" rx="16" fill="#132b3c" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="441" cy="192" r="17" fill="#493b1b" stroke="#fbbf24" stroke-width="2"/>
    <text x="441" y="198" text-anchor="middle" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">03</text>
    <text x="471" y="198" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">Bounded retry</text>
    <text x="471" y="219" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">/ re-resolve</text>
    <rect x="433" y="239" width="130" height="25" rx="12" fill="#493b1b"/>
    <text x="498" y="256" text-anchor="middle" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="700">ONE FRESH RE-RESOLVE</text>
    <text x="433" y="285" fill="#d4c08b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">5 s backoff • cancellation-aware</text>
    <text x="433" y="303" fill="#d4c08b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">429: no automatic retry</text>
  </g>

  <!-- Stage 4 -->
  <g>
    <rect x="605" y="164" width="166" height="148" rx="16" fill="#10273b" stroke="#2c5870" stroke-width="2"/>
    <circle cx="631" cy="192" r="17" fill="#163b52" stroke="#5eead4" stroke-width="2"/>
    <text x="631" y="198" text-anchor="middle" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">04</text>
    <text x="661" y="198" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">Download</text>
    <text x="661" y="219" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">streams</text>
    <rect x="623" y="243" width="58" height="26" rx="6" fill="#163b52" stroke="#35657d"/>
    <rect x="695" y="243" width="58" height="26" rx="6" fill="#163b52" stroke="#35657d"/>
    <text x="652" y="260" text-anchor="middle" fill="#9ddfd6" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="700">VIDEO</text>
    <text x="724" y="260" text-anchor="middle" fill="#9ddfd6" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="700">AUDIO</text>
    <text x="623" y="292" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Partial streams cleaned</text>
    <text x="623" y="310" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">on failure or cancel</text>
  </g>

  <!-- Stage 5 -->
  <g>
    <rect x="795" y="164" width="166" height="148" rx="16" fill="#10273b" stroke="#2c5870" stroke-width="2"/>
    <circle cx="821" cy="192" r="17" fill="#163b52" stroke="#5eead4" stroke-width="2"/>
    <text x="821" y="198" text-anchor="middle" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">05</text>
    <text x="851" y="198" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">Remux or</text>
    <text x="851" y="219" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">transcode</text>
    <text x="813" y="257" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">H.264 + AAC in MP4</text>
    <text x="813" y="275" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">24 / 25 / 30 fps target</text>
    <text x="813" y="293" fill="#9db2c6" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">CPU fallback when needed</text>
  </g>

  <!-- Stage 6 -->
  <g>
    <rect x="985" y="164" width="166" height="148" rx="16" fill="#102b2c" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="1011" cy="192" r="17" fill="#16423b" stroke="#6ee7b7" stroke-width="2"/>
    <text x="1011" y="198" text-anchor="middle" fill="#6ee7b7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">06</text>
    <text x="1041" y="198" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">Publish</text>
    <text x="1041" y="219" fill="#edf6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">without overwrite</text>
    <text x="1003" y="257" fill="#a9d8cb" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Private temp copy</text>
    <text x="1003" y="275" fill="#a9d8cb" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Same-directory rename</text>
    <text x="1003" y="293" fill="#a9d8cb" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">Verify final MP4</text>
  </g>

  <!-- Recovery / failure branch -->
  <path d="M 498 312 V 354 H 339 V 374" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="m 333 365 6 10 6-10" fill="#fbbf24"/>
  <path d="M 498 354 H 861 V 374" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="m 855 365 6 10 6-10" fill="#fb7185"/>

  <rect x="52" y="378" width="575" height="122" rx="16" fill="#281f18" stroke="#fbbf24" stroke-width="2"/>
  <rect x="72" y="398" width="95" height="25" rx="12" fill="#493b1b"/>
  <text x="119" y="415" text-anchor="middle" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700">HTTP 403</text>
  <text x="72" y="452" fill="#f5e6bd" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">Refresh stream details once</text>
  <text x="72" y="475" fill="#d4c08b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">Fresh metadata + formats • best effort • restrictions are never bypassed</text>
  <text x="72" y="492" fill="#d4c08b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">If it still fails, the app stops and exposes Try Again.</text>

  <rect x="647" y="378" width="501" height="122" rx="16" fill="#2b1b28" stroke="#fb7185" stroke-width="2"/>
  <rect x="667" y="398" width="160" height="25" rx="12" fill="#552536"/>
  <text x="747" y="415" text-anchor="middle" fill="#fb9aad" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700">RETRY EXHAUSTED</text>
  <text x="667" y="452" fill="#f8dfe5" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">Visible failure, no false success</text>
  <text x="667" y="475" fill="#d7a8b5" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">403 may mean access, login, age, region, policy, PO-token, or rate limits.</text>
  <text x="667" y="492" fill="#d7a8b5" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">Check availability and try again later; do not treat this as a bypass.</text>

  <line x1="52" y1="526" x2="1148" y2="526" stroke="#1f3a52"/>
  <text x="52" y="546" fill="#718da3" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">Bounded recovery keeps diagnostics honest • output is only marked complete after finalization</text>
</svg>
